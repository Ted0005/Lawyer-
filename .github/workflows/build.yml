name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project Uchyoba.xcodeproj -scheme Uchyoba
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Uchyoba.app Payload/
          zip -r Uchyoba.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Uchyoba-unsigned-ipa
          path: Uchyoba.ipa
